# Routes shown on the model. Geometry comes from OpenStreetMap ways (listed per segment, in
# walking order; the pipeline orients and joins them). Run `pipeline/build_routes.py` after
# editing; it writes content/routes.geojson, which build_web.py drapes onto the terrain.
#
# mode: lift (drawn as a cable between stations) | foot (draped on the terrain)
# DRAFT TEXT: facts to check are listed in docs/content-review.md.

routes:
  - id: south-route
    name:
      en: Southern route (classic)
      ru: Южный маршрут (классика)
      zh: "南线（经典路线）"
      ar: "المسار الجنوبي (الكلاسيكي)"
    summit: west-summit
    stops: [azau, krugosor, mir, garabashi, priyut-11, pastukhov-rocks, saddle, west-summit]
    description:
      en: >-
        The most popular way up Elbrus. Three cable cars lift you from Azau to Garabashi at
        about 3,850 m. From there the route climbs the broad south slope past the huts and
        Pastukhov Rocks, crosses the long diagonal traverse to the saddle and finishes on the
        West Summit. Technically straightforward but serious: altitude, cold and sudden
        whiteouts are the real dangers, so acclimatisation and a guide are strongly advised.
      ru: >-
        Самый популярный путь на Эльбрус. Три канатные дороги поднимают от Азау до Гарабаши
        (около 3850 м). Дальше маршрут идёт по широкому южному склону мимо приютов и скал
        Пастухова, по длинному траверсу «Косая полка» выходит на седловину и заканчивается на
        Западной вершине. Технически несложен, но серьёзен: главные опасности — высота, холод
        и внезапная потеря видимости, поэтому нужны акклиматизация и, желательно, гид.
      zh: "攀登厄尔布鲁士最受欢迎的路线。三段缆车将你从阿扎乌送到海拔约3850米的加拉巴希。此后，路线沿宽阔的南坡向上，经过各避难所和帕斯图霍夫岩，再走过长长的斜向横切路段抵达鞍部，最终登上西峰。这条路线技术难度不高，却绝不能掉以轻心：真正的危险来自高海拔、严寒和突如其来的白化天气，因此强烈建议做好高度适应并聘请向导。"
      ar: "أكثر طرق الصعود إلى إلبروس شيوعًا. تنقلك ثلاثة تلفريكات من آزاو إلى غاراباشي على ارتفاع نحو 3850 مترًا. ومن هناك يصعد المسار المنحدر الجنوبي العريض مرورًا بالملاجئ وصخور باستوخوف، ثم يعبر الممر المائل الطويل إلى السرج، وينتهي عند القمة الغربية. المسار سهل من الناحية التقنية لكنه ليس هيّنًا: فالخطر الحقيقي يكمن في الارتفاع والبرد وانعدام الرؤية المفاجئ، لذا يُنصح بشدة بالتأقلم مع الارتفاع والاستعانة بمرشد."
    segments:
      - mode: lift
        name: { en: "Elbrus-1 gondola: Azau → Krugosor", ru: "Гондола «Эльбрус-1»: Азау → Кругозор", zh: "“厄尔布鲁士-1”吊厢缆车：阿扎乌 → 克鲁戈佐尔", ar: "تلفريك «إلبروس-1»: من آزاو إلى كروغوزور" }
        osm_ways: [101262111]
      - mode: lift
        name: { en: "Elbrus-2 gondola: Krugosor → Mir", ru: "Гондола «Эльбрус-2»: Кругозор → Мир", zh: "“厄尔布鲁士-2”吊厢缆车：克鲁戈佐尔 → 米尔", ar: "تلفريك «إلبروس-2»: من كروغوزور إلى مير" }
        osm_ways: [72200843]
      - mode: lift
        name: { en: "Elbrus-3 gondola: Mir → Garabashi", ru: "Гондола «Эльбрус-3»: Мир → Гарабаши", zh: "“厄尔布鲁士-3”吊厢缆车：米尔 → 加拉巴希", ar: "تلفريك «إلبروس-3»: من مير إلى غاراباشي" }
        osm_ways: [265771549]
      - mode: foot
        name: { en: "South trail past the huts to Pastukhov Rocks and above", ru: "Южная тропа мимо приютов к скалам Пастухова и выше", zh: "南坡步道：途经各避难所，前往帕斯图霍夫岩及更高处", ar: "الدرب الجنوبي مرورًا بالملاجئ إلى صخور باستوخوف وما فوقها" }
        osm_ways: [226056643]
      - mode: foot
        name: { en: "Diagonal traverse (Kosaya Polka) to the saddle", ru: "Траверс «Косая полка» на седловину", zh: "斜向横切路段（科萨亚波尔卡）通往鞍部", ar: "الممر المائل («كوسايا بولكا») إلى السرج" }
        osm_ways: [226056654]
      - mode: foot
        name: { en: "Final climb to the West Summit", ru: "Подъём на Западную вершину", zh: "最后冲顶西峰", ar: "الصعود الأخير إلى القمة الغربية" }
        osm_ways: [1365327953, 46931794]

  - id: north-route
    name:
      en: Northern route
      ru: Северный маршрут
      zh: "北线"
      ar: "المسار الشمالي"
    summit: east-summit
    stops: [jily-su, north-hut, east-summit]
    description:
      en: >-
        The wilder approach from Jily-Su: no lifts, a long walk-in to the north base camp near
        the Lakkolit rocks, and a long summit day up the glacier to the East Summit.
      ru: >-
        Более дикий подход от Джилы-Су: без подъёмников, долгий путь к северному базовому
        лагерю у скал Лакколит и длинный штурмовой день по леднику к Восточной вершине.
      zh: "从吉雷苏出发、更为原始的攀登路线：没有缆车，需长途跋涉至拉科利特岩附近的北线大本营，再经历沿冰川冲击东峰的漫长登顶日。"
      ar: "الطريق الأكثر بريّةً انطلاقًا من جيلي سو: لا مصاعد، بل مسيرة طويلة إلى معسكر القاعدة الشمالي قرب صخور لاكوليت، ثم يوم صعود طويل عبر النهر الجليدي إلى القمة الشرقية."
    segments:
      - mode: foot
        name: { en: "Walk-in from Jily-Su to the north base camp", ru: "Подход от Джилы-Су к северному базовому лагерю", zh: "从吉雷苏徒步前往北线大本营", ar: "المسير من جيلي سو إلى معسكر القاعدة الشمالي" }
        osm_ways: [1315339940, 245197306, 1315339941, 971695910, 437923506, 437923505, 245197317, 767336212]
      - mode: foot
        name: { en: "North slope to the East Summit", ru: "Северный склон к Восточной вершине", zh: "沿北坡登上东峰", ar: "المنحدر الشمالي إلى القمة الشرقية" }
        osm_ways: [56131844]
