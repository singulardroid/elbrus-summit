# Elbrus 3D: pipeline configuration
# Every pipeline step reads this file. Change the area here and re-run the pipeline.

area:
  name: elbrus
  # Approximate centre of the massif (between the West and East summits).
  center_lonlat: [42.45, 43.35]
  # Core square, in metres, on the projected CRS. 40 km gives roughly lon 42.20–42.70, lat 43.17–43.53.
  size_m: 40000
  crs: "EPSG:32638"            # WGS 84 / UTM zone 38N

# The land around the block out to the horizon: built by build_horizon.py from Copernicus GLO-90
# (two rings: ~120 km at ~400 m, ~360 km at ~2 km; the layout is set in the script).
horizon_ring:
  enabled: true
  source: copernicus-glo90

dem:
  source: copernicus-glo30
  bucket: "s3://copernicus-dem-30m"
  resolution_m: 30
  fill_voids: true
  sanity_check:
    max_elevation_m: [5600, 5700]   # West summit is about 5642 m

imagery:
  source: sentinel-2-l2a
  stac_url: "https://earth-search.aws.element84.com/v1"
  collection: sentinel-2-l2a
  months: [8, 9]
  years: [2023, 2024, 2025]
  max_cloud_pct: 5
  # Pinned acquisition date (YYYY-MM-DD) for reproducible builds; null = auto-pick clearest / least snow.
  date: "2025-08-24"
  resolution_m: 10

osm:
  overpass_url: "https://overpass-api.de/api/interpreter"
  tags:
    - natural=peak
    - natural=saddle
    - natural=glacier
    - tourism=alpine_hut
    - tourism=viewpoint
    - aerialway
    - place

# Quadtree terrain tiles (phase 3). Level 0 = whole area, each level splits tiles in 4.
tiles:
  levels: 4                           # 1, 4, 16, 64 tiles
  max_error_m: [40, 16, 6, 2]         # Delatin mesh simplification tolerance per level
  texture_px: [1024, 1024, 1024, 512] # texture size per tile (≈39, 20, 10, 10 m/px)
  texture_quality: 82                 # WebP quality
  skirt_min_m: 40                     # skirts hide cracks between neighbouring tiles
  skirt_error_factor: 4               # skirt depth = max(min, factor * level error)
  position_bits: 14                   # gltfpack position quantization

output_dir: ../data/build

web:
  out_subdir: elbrus           # → data/build/elbrus/
  collision_cell_px: 4         # 4 x 30 m = 120 m max-pooled height grid for camera collision

# The guided climb ("250 stories"): doors spaced evenly along one route, start to summit.
journey:
  route: south-route
  doors: 250
  step_m: 3                    # path sample spacing for the camera rail and trail
  zigzag_m: [3, 28]            # random sideways offset per door (plus a slow random drift)
  seed: 250
