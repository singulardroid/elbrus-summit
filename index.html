    <style>html,body{background:#05030f;height:100%;margin:0}.boot{z-index:1000;color:#eef3f7;--pad:clamp(16px, 6vw, 80px);background:radial-gradient(120% 90% at 20% 0,#1c0b40 0%,#05030f 62%);font-family:Onest,system-ui,sans-serif;transition:opacity .7s;position:fixed;inset:0;overflow:hidden}.boot.is-done{opacity:0;pointer-events:none}.boot-top{inset-inline:var(--pad);position:absolute;top:clamp(36px,12vh,140px)}.boot-kicker{letter-spacing:.14em;text-transform:uppercase;color:#ffb08a;font:500 12px JetBrains Mono,ui-monospace,monospace}.boot-alt{align-items:baseline;gap:.18em;margin-top:10px;display:flex}.boot-num{letter-spacing:-.03em;font-variant-numeric:tabular-nums;font:800 clamp(64px,17vw,200px)/.9 Unbounded,system-ui,sans-serif}.boot-unit{color:#a9bacd;font:400 clamp(20px,4vw,44px) Unbounded,system-ui,sans-serif}.boot-stn{color:#ff7a3d;min-height:1.3em;margin-top:14px;font:500 clamp(14px,1.6vw,18px) JetBrains Mono,ui-monospace,monospace}.boot-route{inset-inline:var(--pad);height:calc(32vh + 34px);position:absolute;bottom:clamp(44px,9vh,100px)}.boot-chart{width:100%;height:32vh;position:absolute;top:0;left:0;overflow:visible}.boot[dir=rtl] .boot-chart{transform:scaleX(-1)}.boot-dot{background:#ff7a3d;border-radius:50%;width:14px;height:14px;margin:-7px 0 0 -7px;position:absolute;box-shadow:0 0 0 4px #ff7a3d40,0 0 24px #ff7a3d}.boot-names{height:18px;position:absolute;bottom:0;left:0;right:0}.boot-names span{color:#a9bacd;white-space:nowrap;font:500 11px JetBrains Mono,ui-monospace,monospace;transition:color .3s;position:absolute;top:0;transform:translate(-50%)}.boot-names span.is-on{color:#ffb08a}.boot-names span:first-child{transform:none}.boot-names span:last-child,.boot[dir=rtl] .boot-names span:first-child{transform:translate(-100%)}.boot[dir=rtl] .boot-names span:last-child{transform:none}.boot[dir=rtl] .boot-alt{justify-content:flex-end}.boot[dir=rtl] .boot-kicker,.boot[dir=rtl] .boot-stn,.boot[dir=rtl] .boot-names span{letter-spacing:0;text-transform:none;font-family:Noto Sans Arabic,Geeza Pro,Segoe UI,system-ui,sans-serif}.boot[dir=rtl] .boot-kicker{font-size:14px;font-weight:600}@media (max-width:640px){.boot-names span:nth-child(2n){display:none}}@media (max-height:520px){.boot-route{height:calc(26vh + 30px)}.boot-chart{height:26vh}}@media (prefers-reduced-motion:reduce){.boot{transition:none}.boot-dot{box-shadow:0 0 0 4px #ff7a3d40}}</style>

  <body>
    <div id="app"></div>

    <script>
      (function () {
        // The real route profile (81 samples, Azau → West Summit, 13.5 km) and its stations.
        var H = [2363,2400,2442,2483,2526,2572,2615,2666,2726,2788,2849,2898,2936,2965,2988,3020,3060,3098,3125,3151,3188,3237,3292,3359,3422,3455,3468,3482,3508,3537,3565,3614,3669,3706,3741,3788,3834,3864,3889,3917,3942,3958,3974,4007,4046,4082,4118,4160,4207,4256,4306,4357,4410,4458,4498,4542,4599,4661,4722,4781,4839,4899,4962,5027,5092,5157,5215,5260,5292,5315,5331,5338,5340,5362,5411,5467,5517,5562,5592,5608,5625];

        var T = {

          en: { k: "Russia's Peak · Loading Elbrus", u: 'm', loc: 'en-US', s: ['Azau', 'Krugozor', 'Mir', 'Garabashi', 'Priyut 11', 'Pastukhov', 'Saddle', 'Summit'] },
          zh: { k: '俄罗斯之巅 · 正在加载厄尔布鲁士', u: '米', loc: 'zh-CN', s: ['阿扎乌', '克鲁戈佐尔', '米尔', '加拉巴希', '11号避难所', '帕斯图霍夫岩', '鞍部', '西峰'] },

        };
        // Same choice as i18n.ts: ?lang=, then the saved one, then the browser's, then English.
        function pick() {
          var ok = function (v) { return v && T[v] ? v : null; };
          var v = ok(new URLSearchParams(location.search).get('lang'));
          if (v) return v;
          try { v = ok(localStorage.getItem('elbrus.lang')); if (v) return v; } catch (e) {}
          var tags = navigator.languages || [navigator.language];

        var lang = pick(), t = T[lang], rtl = lang === 'ar';
        var el = document.getElementById('boot'), $ = function (s) { return el.querySelector(s); };

        $('.boot-kicker').textContent = t.k;
        $('.boot-unit').textContent = t.u;

        var y = function (a) { return ((5800 - a) / 3600) * 300; };
        var pts = H.map(function (a, i) { return (i * 12.5).toFixed(1) + ',' + y(a).toFixed(1); }).join(' ');
        var lines = el.querySelectorAll('.boot-line');
        lines[0].setAttribute('points', pts);
        lines[1].setAttribute('points', pts);
        $('.boot-area').setAttribute('points', '0,300 ' + pts + ' 1000,300');
        $('.boot-grid').innerHTML = [3000, 4000, 5000].map(function (a) { return '<line x1="0" x2="1000" y1="' + y(a) + '" y2="' + y(a) + '"/>'; }).join('') +
          STN.map(function (f) { var a = H[Math.round(f * 80)]; return '<line x1="' + f * 1000 + '" x2="' + f * 1000 + '" y1="' + y(a) + '" y2="300"/>'; }).join('');
        $('.boot-names').innerHTML = t.s.map(function (n, i) {
          return '<span style="left:' + ((rtl ? 1 - STN[i] : STN[i]) * 100) + '%">' + n + '</span>';
        }).join('');
        var names = el.querySelectorAll('.boot-names span');

        var fmt = new Intl.NumberFormat(t.loc);
        var alt = function (f) { // the profile, its ends pinned to Azau (2350) and the summit (5642)
          var x = f * 80, i = Math.min(Math.floor(x), 79), k = x - i;
          var a = H[i] + (H[i + 1] - H[i]) * k;
          return 2350 + ((a - 2363) * (5642 - 2350)) / (5625 - 2363);
        };

        var shown = 0, target = 0, real = 0, done = false, t0 = performance.now(), last = t0, raf = 0;
        var num = $('.boot-num'), stn = $('.boot-stn'), clip = $('.boot-clip'), dot = $('.boot-dot'), chart = $('.boot-chart');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function frame(now) {
          var dt = Math.min((now - last) / 1000, 0.1);
          last = now;
          // While the code downloads, creep up the first slopes; then follow the real progress.
          target = Math.max(target, real, done ? 1 : Math.min(0.16, ((now - t0) / 1000) * 0.035));
          shown += (target - shown) * (reduce ? 1 : Math.min(1, dt * (done ? 6 : 2.5)));
          if (target - shown < 0.0005) shown = target;
          var f = shown, a = alt(f);
          num.textContent = fmt.format(Math.round(a));
          var at = 0;
          for (var i = 0; i < STN.length; i++) if (f >= STN[i] - 0.004) at = i;
          stn.textContent = t.s[at];
          for (i = 0; i < names.length; i++) names[i].classList.toggle('is-on', i <= at);
          clip.setAttribute('width', String(f * 1000 + 10));
          var r = chart.getBoundingClientRect(), host = chart.parentNode.getBoundingClientRect();
          var fx = rtl ? 1 - f : f;
          dot.style.left = (r.left - host.left + fx * r.width) + 'px';
          dot.style.top = (r.top - host.top + ((y(a) + 12) / 324) * r.height) + 'px';
          el.setAttribute('aria-valuenow', String(Math.round(f * 100)));
          if (done && shown >= 1) {
            el.classList.add('is-done');
            setTimeout(function () { el.remove(); }, 800);
            return;
          }
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);

        // The app's hooks: progress 0…1, then done (climbs to the summit, then fades out).
        window.elbrusBoot = {
          set: function (f) { real = Math.max(real, Math.min(Math.max(f, 0), 1)); },
          done: function () { done = true; },
          error: function () { cancelAnimationFrame(raf); el.remove(); }
        };
      })();
